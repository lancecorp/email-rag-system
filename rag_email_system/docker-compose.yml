version: "3.8"

services:
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  streamlit:
    build: .
    container_name: rag-email
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - opensearch
